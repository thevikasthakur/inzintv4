<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Client testimonial for the La Cuisine de Bernard platform rebuild</title>
  <desc id="desc">A five-star client review thanking Inzint for taking the project seriously and finding the right solutions.</desc>
  <defs>
    <linearGradient id="background" x1="90" y1="40" x2="1500" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFDF7"/>
      <stop offset="1" stop-color="#F3EADB"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#E24D35"/>
      <stop offset="1" stop-color="#A6202C"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#6F3525" flood-opacity=".15"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="56" fill="url(#background)"/>
  <circle cx="1484" cy="110" r="210" fill="#E24D35" opacity=".07"/>
  <circle cx="112" cy="824" r="260" fill="#D9A55A" opacity=".09"/>
  <path d="M1320 0h280v278c-88-18-169-58-221-115-39-42-58-96-59-163Z" fill="url(#accent)" opacity=".95"/>

  <g filter="url(#shadow)">
    <rect x="92" y="84" width="1416" height="732" rx="42" fill="#FFFFFF" fill-opacity=".94"/>
  </g>

  <g transform="translate(154 146)">
    <rect width="310" height="48" rx="24" fill="#F6E8DF"/>
    <text x="155" y="31" text-anchor="middle" fill="#7A2D27" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">CLIENT TESTIMONIAL</text>
  </g>

  <g transform="translate(154 236)" fill="#F0562B" aria-label="Five out of five stars">
    <path d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(58)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(116)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(174)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(232)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
  </g>
  <text x="470" y="270" fill="#17202A" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">5.0</text>
  <line x1="560" y1="232" x2="560" y2="278" stroke="#D7CAB9" stroke-width="2"/>
  <text x="594" y="268" fill="#6C625B" font-family="Arial, Helvetica, sans-serif" font-size="27">25 April – 18 August 2026</text>

  <text x="150" y="356" fill="#17202A" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">
    <tspan x="150" dy="0">“Inzint took this project very seriously,</tspan>
    <tspan x="150" dy="58">found the right solutions, communicated clearly,</tspan>
    <tspan x="150" dy="58">stayed accountable for outcomes and paid close</tspan>
    <tspan x="150" dy="58">attention to detail.”</tspan>
  </text>

  <line x1="150" y1="628" x2="1448" y2="628" stroke="#E7DED2" stroke-width="2"/>
  <circle cx="184" cy="708" r="34" fill="url(#accent)"/>
  <text x="184" y="717" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">IN</text>
  <text x="242" y="704" fill="#17202A" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">La Cuisine de Bernard</text>
  <text x="242" y="741" fill="#756B63" font-family="Arial, Helvetica, sans-serif" font-size="21">Client feedback · Platform rebuild</text>
</svg>
