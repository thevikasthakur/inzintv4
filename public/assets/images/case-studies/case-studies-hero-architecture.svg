<svg width="720" height="560" viewBox="0 0 720 560" fill="none" xmlns="http://www.w3.org/2000/svg">
  <title>Content platform architecture</title>
  <desc>Legacy records pass through a transformation layer and become structured content for web, search, and artificial intelligence.</desc>
  <defs>
    <linearGradient id="panel" x1="118" y1="74" x2="608" y2="505" gradientUnits="userSpaceOnUse">
      <stop stop-color="#122A45"/>
      <stop offset="1" stop-color="#071423"/>
    </linearGradient>
    <linearGradient id="blue" x1="302" y1="172" x2="443" y2="392" gradientUnits="userSpaceOnUse">
      <stop stop-color="#54A5FF"/>
      <stop offset="1" stop-color="#0069FF"/>
    </linearGradient>
    <linearGradient id="card" x1="465" y1="138" x2="595" y2="424" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#DDEBFF"/>
    </linearGradient>
    <radialGradient id="halo" cx="0" cy="0" r="1" gradientTransform="translate(372 278) rotate(90) scale(252)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0878FF" stop-opacity=".24"/>
      <stop offset="1" stop-color="#0878FF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" stroke="#8DC0FF" stroke-opacity=".09"/>
    </pattern>
    <filter id="shadow" x="-40%" y="-40%" width="180%" height="180%" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#001027" flood-opacity=".48"/>
    </filter>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="34" y="30" width="652" height="500" rx="42" fill="url(#panel)" stroke="#8DC0FF" stroke-opacity=".14"/>
  <rect x="34" y="30" width="652" height="500" rx="42" fill="url(#grid)"/>
  <circle cx="372" cy="278" r="252" fill="url(#halo)"/>

