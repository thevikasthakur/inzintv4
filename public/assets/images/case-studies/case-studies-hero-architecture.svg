  <g font-family="Inter, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8">
    <text x="85" y="110" fill="#87A8CA">LEGACY</text>
    <text x="320" y="164" fill="#9DCBFF">TRANSFORM</text>
    <text x="485" y="108" fill="#87A8CA">STRUCTURED</text>
