<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">ZoeyMed platform architecture</title>
  <desc id="desc">Clinic teams use a React and Redux interface connected to Fastify APIs for scheduling, patient and laboratory workflows, and inventory, backed by MongoDB and AWS.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f0f9ff"/>
      <stop offset="1" stop-color="#effcf5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#0f172a" flood-opacity=".09"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="36" fill="url(#bg)"/>
  <g fill="none" stroke="#94a3b8" stroke-width="3">
    <path d="M600 142v48"/>
    <path d="M600 282v49M255 331h690M255 331v45M485 331v45M715 331v45M945 331v45"/>
    <path d="M255 482v50h690v-50M600 532v32"/>
  </g>
  <g filter="url(#shadow)" font-family="Inter,Arial,sans-serif" text-anchor="middle">
    <g>
      <rect x="350" y="58" width="500" height="84" rx="20" fill="#0f172a"/>
      <text x="600" y="94" fill="#fff" font-size="22" font-weight="700">Clinic teams</text>
      <text x="600" y="121" fill="#cbd5e1" font-size="16">Front desk · clinicians · laboratory staff</text>
    </g>
    <g>
      <rect x="350" y="190" width="500" height="92" rx="20" fill="#fff"/>
      <text x="600" y="228" fill="#0f172a" font-size="22" font-weight="700">React interface</text>
      <text x="600" y="257" fill="#475569" font-size="16">Redux-managed workflow state</text>
    </g>
    <g fill="#fff">
      <rect x="145" y="376" width="220" height="106" rx="20"/>
      <rect x="375" y="376" width="220" height="106" rx="20"/>
      <rect x="605" y="376" width="220" height="106" rx="20"/>
      <rect x="835" y="376" width="220" height="106" rx="20"/>
    </g>
    <g fill="#0f172a" font-size="18" font-weight="700">
      <text x="255" y="420">Scheduling</text><text x="255" y="446">and cycles</text>
      <text x="485" y="420">Patient</text><text x="485" y="446">records</text>
      <text x="715" y="420">Laboratory</text><text x="715" y="446">workflows</text>
      <text x="945" y="420">Inventory</text><text x="945" y="446">management</text>
    </g>
    <g>
      <rect x="450" y="298" width="300" height="68" rx="18" fill="#047857"/>
      <text x="600" y="340" fill="#fff" font-size="20" font-weight="700">Fastify REST API</text>
    </g>
    <g>
      <rect x="310" y="564" width="270" height="68" rx="18" fill="#fff"/>
      <rect x="620" y="564" width="270" height="68" rx="18" fill="#fff"/>
      <text x="445" y="606" fill="#0f172a" font-size="20" font-weight="700">MongoDB</text>
      <text x="755" y="606" fill="#0f172a" font-size="20" font-weight="700">AWS infrastructure</text>
    </g>
  </g>
</svg>
