<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Client testimonial for the Thotis IA engagement</title>
  <desc id="desc">A five-star client review thanking Inzint for its work and praising its quality, communication and accountability.</desc>
  <defs>
    <linearGradient id="background" x1="60" y1="40" x2="1540" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D2B"/>
      <stop offset=".55" stop-color="#11184B"/>
      <stop offset="1" stop-color="#202A77"/>
    </linearGradient>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#5368FF"/>
      <stop offset="1" stop-color="#8B6CFF"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop stop-color="#5368FF" stop-opacity=".5"/>
      <stop offset="1" stop-color="#5368FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#00051C" flood-opacity=".45"/>
    </filter>
  </defs>

  <rect width="1600" height="900" rx="56" fill="url(#background)"/>
  <circle cx="1380" cy="140" r="360" fill="url(#glow)"/>
  <circle cx="190" cy="850" r="330" fill="url(#glow)" opacity=".6"/>
  <g opacity=".12" stroke="#A8B4FF">
    <path d="M0 120h1600M0 240h1600M0 360h1600M0 480h1600M0 600h1600M0 720h1600"/>
    <path d="M180 0v900M360 0v900M540 0v900M720 0v900M900 0v900M1080 0v900M1260 0v900M1440 0v900"/>
  </g>

  <g filter="url(#shadow)">
    <rect x="92" y="84" width="1416" height="732" rx="42" fill="#11183D" fill-opacity=".92" stroke="#6374FF" stroke-opacity=".45" stroke-width="2"/>
  </g>

  <g transform="translate(154 146)">
    <rect width="310" height="48" rx="24" fill="#5368FF" fill-opacity=".18" stroke="#6F7EFF" stroke-opacity=".55"/>
    <text x="155" y="31" text-anchor="middle" fill="#C9D0FF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" letter-spacing="2">CLIENT TESTIMONIAL</text>
  </g>

  <g transform="translate(154 236)" fill="#FFB34D" aria-label="Five out of five stars">
    <path d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(58)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(116)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(174)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
    <path transform="translate(232)" d="m24 0 7.2 14.7 16.2 2.3-11.7 11.4 2.8 16.1L24 36.9 9.5 44.5l2.8-16.1L.6 17l16.2-2.3Z"/>
  </g>
  <text x="470" y="270" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="700">5.0</text>
  <line x1="560" y1="232" x2="560" y2="278" stroke="#56609B" stroke-width="2"/>
  <text x="594" y="268" fill="#AAB3E3" font-family="Arial, Helvetica, sans-serif" font-size="27">14 April – 18 August 2026</text>

  <text x="150" y="366" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="48" font-weight="700">
    <tspan x="150" dy="0">“Thanks to Inzint for all the work they’ve done.</tspan>
    <tspan x="150" dy="60">They were committed to quality,</tspan>
    <tspan x="150" dy="60">communicated clearly and stayed accountable</tspan>
    <tspan x="150" dy="60">for outcomes.”</tspan>
  </text>

  <g transform="translate(1255 175)">
    <circle cx="90" cy="90" r="90" fill="url(#violet)" opacity=".18"/>
    <circle cx="90" cy="90" r="68" fill="#151D53" stroke="#7080FF" stroke-width="2"/>
    <path d="m43 116 31-51h-21l15-25h64L101 91h22l-15 25Z" fill="#FFFFFF"/>
  </g>

  <line x1="150" y1="628" x2="1448" y2="628" stroke="#343F7B" stroke-width="2"/>
  <circle cx="184" cy="708" r="34" fill="url(#violet)"/>
  <text x="184" y="717" text-anchor="middle" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800">IN</text>
  <text x="242" y="704" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700">Thotis IA</text>
  <text x="242" y="741" fill="#B7BFE9" font-family="Arial, Helvetica, sans-serif" font-size="21">Client feedback · AI platform engineering</text>
</svg>
